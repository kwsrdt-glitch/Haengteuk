<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>행특 키워드 조합기</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#222; --sub:#6b6b66; --line:#e4e2dc;
  --accent:#2f6f5e; --accent-ink:#fff; --accent-soft:#e3f0ec;
  --uniq:#b5651d; --uniq-soft:#fbeede; --mine:#5b4bb5; --mine-soft:#ece9fa;
  --danger:#b3382c; --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;grid-template-rows:auto 1fr;height:100vh;gap:0}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700}
header .note{color:var(--sub);font-size:12px}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
.btn:hover{background:#f1efe9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--danger)}
.col{background:var(--panel);overflow:auto;min-height:0}
.col.left{border-right:1px solid var(--line);display:flex;flex-direction:column}
.col.right{border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.col.mid{background:var(--bg);padding:12px 16px 40px}
.lhead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--panel);z-index:2}
.lhead b{flex:1}
.slist{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.srow{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.srow:hover{background:#f4f2ec}
.srow.cur{background:var(--accent-soft);border-color:var(--accent)}
.srow .no{width:26px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .bd{font-size:11px;min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:#eee;color:var(--sub)}
.srow .bd.has{background:var(--accent);color:#fff}
.srow input{min-width:0;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff}
.srow input.n{width:44px;text-align:right}
.srow input.m{flex:1}
.empty{padding:20px 14px;color:var(--sub);text-align:center}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 11px}
.seg button.on{background:var(--accent);color:#fff}
.search{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:12.5px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab i{font-style:normal;margin-left:4px;color:var(--accent);font-weight:700}
.tab.on i{color:#9be0c7}
.catnav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.catnav .cnt{color:var(--sub);font-size:12.5px;flex:0 0 auto}
.catnav .sp{flex:1}
#secs.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
#secs.grid .sec{margin-bottom:0}
#secs.grid .addkw.wide{grid-column:1/-1}
@media (max-width:1180px){#secs.grid{display:block}#secs.grid .sec{margin-bottom:12px}}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.sec h3{margin:0 0 8px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.sec h3 small{color:var(--sub);font-weight:400}
.sec h3 .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fbfaf8;border-radius:99px;padding:3px 11px;font-size:13px;display:inline-flex;align-items:center;gap:4px;position:relative}
.chip.g{background:var(--uniq-soft);border-color:#ecd3b3}
.chip.m{background:var(--mine-soft);border-color:#d3cdf0}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip sup{font-size:10px;opacity:.6}
.chip .x{margin-left:2px;color:var(--danger);font-weight:700}
.chip.on .x{color:#ffd6d0}
.addkw{display:flex;gap:6px;margin-top:10px}
.addkw input{flex:1;border:1px dashed var(--line);border-radius:8px;padding:5px 9px;background:#fff}
.who{font-size:15px;font-weight:700}
.who small{color:var(--sub);font-weight:400;margin-left:6px}
.rchips{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;padding:8px;border:1px dashed var(--line);border-radius:var(--radius);background:#fbfaf8}
.rchips .chip{cursor:grab;background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.rchips .ph{color:var(--sub);font-size:12.5px}
.out{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:var(--radius);padding:10px;background:#fff;line-height:1.7}
textarea.memo{width:100%;min-height:54px;resize:vertical;border:1px solid var(--line);border-radius:var(--radius);padding:8px;background:#fff}
label.lb{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.free{display:flex;gap:6px}
.free input{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 9px}
details.menu{position:relative}
details.menu summary{list-style:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;background:var(--panel)}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:flex;flex-direction:column;min-width:190px;z-index:20}
details.menu .pop button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px}
details.menu .pop button:hover{background:#f1efe9}
dialog{border:1px solid var(--line);border-radius:14px;padding:18px;width:min(520px,92vw);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 6px;font-size:16px}
dialog p{margin:0 0 10px;color:var(--sub);font-size:12.5px}
dialog textarea{width:100%;height:280px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit}
dialog .row{justify-content:flex-end;margin-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:.95}
@media (max-width:980px){
  .app{display:block;height:auto}
  .col{overflow:visible}
  .col.left{border-right:0;border-bottom:1px solid var(--line)}
  .slist{max-height:260px}
  .col.right{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>행특 키워드 조합기</h1>
    <span class="note">데이터는 이 브라우저에만 저장됩니다</span>
    <span class="sp"></span>
    <button class="btn" id="btnEditKw">키워드 편집</button>
    <details class="menu" id="menu">
      <summary>더보기</summary>
      <div class="pop">
        <button id="mCsv">CSV 내보내기 (카테고리를 한 칸에 정리)</button>
        <button id="mCsv2">CSV 내보내기 (카테고리를 열로 분리)</button>
        <button id="mCopyAll">전체 복사 (엑셀에 붙여넣기)</button>
        <button id="mBackup">백업 파일 저장 (JSON)</button>
        <button id="mRestore">백업 파일 불러오기</button>
        <button id="mResetKw">키워드 목록 처음 상태로</button>
        <button id="mResetAll" style="color:var(--danger)">모든 데이터 지우기</button>
      </div>
    </details>
    <input type="file" id="fileRestore" accept=".json,application/json" hidden>
  </header>

  <aside class="col left">
    <div class="lhead">
      <b>명렬표</b>
      <button class="btn sm" id="btnPaste">붙여넣기</button>
      <button class="btn sm" id="btnEditRoster">수정</button>
    </div>
    <div class="lhead" style="top:46px;gap:10px;font-size:12.5px">
      <label><input type="checkbox" id="onlyTodo"> 미선택만 보기</label>
      <span id="prog" style="margin-left:auto;color:var(--sub)"></span>
    </div>
    <ul class="slist" id="slist"></ul>
    <div class="lhead" id="addRow" style="position:static;border-top:1px solid var(--line);border-bottom:0;display:none">
      <button class="btn sm" id="btnAddStu">+ 학생 추가</button>
    </div>
  </aside>

  <main class="col mid" id="mid">
    <div class="tools">
      <div class="seg" id="seg">
        <button data-f="all" class="on">전체</button>
        <button data-f="b">기본형</button>
        <button data-f="g">개성형</button>
        <button data-f="m">내 키워드</button>
      </div>
      <input class="search" id="q" type="search" placeholder="키워드 검색">
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="catnav" id="catNav"></div>
    <div id="secs"></div>
  </main>

  <aside class="col right" id="right"></aside>
</div>

<dialog id="dlgPaste">
  <h2>명렬표 붙여넣기 / 일괄 수정</h2>
  <p>한 줄에 한 명씩 적습니다. <b>번호 이름</b> 형식(엑셀에서 두 열을 복사해 붙여넣어도 됩니다). 번호가 없으면 순서대로 매깁니다. 이미 있는 이름은 선택한 키워드가 유지됩니다.</p>
  <textarea id="paste" placeholder="1&#9;김가나&#10;2&#9;이다라&#10;3&#9;박마바"></textarea>
  <div class="row">
    <button class="btn" id="pasteCancel">취소</button>
    <button class="btn primary" id="pasteOk">적용</button>
  </div>
</dialog>
<dialog id="dlgPrompt">
  <h2>AI 지시문 수정</h2>
  <p><b>AI용 복사</b>를 누르면 이 지시문 뒤에 학생의 키워드가 붙어서 복사됩니다. 학생 이름은 포함되지 않습니다.</p>
  <textarea id="promptText" style="height:240px"></textarea>
  <div class="row">
    <button class="btn" id="promptDefault">기본값으로</button>
    <span style="flex:1"></span>
    <button class="btn" id="promptCancel">취소</button>
    <button class="btn primary" id="promptSave">저장</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 기본 키워드 데이터 (b=기본형, g=개성형, m=내 키워드) ---------- */
function parse(str, k){ return str.split('·').map(s => s.trim()).filter(Boolean).map(t => ({t, k})); }
function mk(id, name, base, uniq){
  const seen = new Set(), items = [];
  [...parse(base, 'b'), ...parse(uniq || '', 'g')].forEach(it => { if(!seen.has(it.t)){ seen.add(it.t); items.push(it); } });
  return {id, name, items};
}
const EXTRA = {
 c1:['수업 경청 · 자료 준비 철저 · 스스로 질문함 · 학습 목표 설정 · 노트 정리 · 수행평가 성실 · 모르는 것을 확인함 · 개념 정리 · 학습 방법 개선 · 자습 태도 좋음','공부하는 법을 찾아감 · 몰입의 순간이 있음 · 끈기 있게 붙잡음'],
 c2:['정보 해석 · 자료 비교 · 원인 분석 · 비유로 이해 · 개념 연결 · 요약 능력','맥락을 읽음 · 숨은 의미를 찾음'],
 c3:['약속을 지킴 · 거짓이 없음 · 양심적 · 선한 마음 · 따뜻한 말씨 · 정의로움 · 용서할 줄 앎','품격이 있음 · 인품이 느껴짐 · 마음 씀씀이가 큼'],
 c4:['친구 고민을 들어줌 · 친구를 응원함 · 모두와 두루 어울림 · 협동 활동 즐김 · 화해를 이끎 · 친구에게 신뢰를 줌 · 대화가 편안함','따돌림에 맞섬 · 약자 편에 섬 · 곁을 지키는 사람'],
 c5:['학급 회의 적극 · 학급 게시판 관리 · 체험학습 참여 · 체육대회 적극 · 학교 행사 기여 · 학급 규칙 존중 · 선생님을 도움','공동체를 먼저 생각함 · 이름 없는 일을 맡음'],
 c6:['모둠장 역할 · 회의 진행 · 발표 담당 · 자료 조사 담당 · 기록 담당 · 팀 성과 기여 · 목표를 함께 이룸','팀의 중심을 잡음 · 갈등을 풀어냄'],
 c7:['긍정적 자아상 · 낙천적 · 차분함 · 안정감 · 자기 주도 생활 · 감정 표현 · 자신의 강점 앎','스스로를 믿음 · 마음 근육이 단단함 · 흔들림에서 회복이 빠름'],
 c8:['경청 태도 · 말하기 능력 · 쓰기 능력 · 적극적 의사 표현 · 논점 정리 · 자기 생각 표현 · 질문과 답변 능력 · 소통 의지','말에 힘이 있음 · 문장이 단정함 · 말의 온도가 따뜻함'],
 c9:['자료 탐색 · 탐구 과정 성실 · 독서 활동 · 코딩 흥미 · 호기심 많음 · 관찰 기록 · 조사 활동 적극','호기심이 질문이 됨 · 작은 것도 놓치지 않음'],
 c10:['협동 운동 · 체육 활동 적극 · 무대 표현 · 공연 참여 · 영상 제작 · 건강 관리 · 만들기 · 그림 · 노래 · 춤 · 글씨 · 사진','표현의 결이 독특함 · 몸짓과 표현이 풍부함 · 색감이 좋음'],
 c11:['진로 발표 · 체험 활동 · 장래 희망 구체적 · 비전 · 진로 활동 성실 · 직업 탐구','꿈의 방향이 분명함 · 자기 길을 그려봄'],
 c12:['발전 속도 빠름 · 한 학기 동안 성장 · 자기 변화 · 책임감이 커짐 · 협동심 향상 · 대인관계 향상 · 성장 폭이 큼 · 앞으로가 기대됨','작은 변화가 쌓임 · 달라진 눈빛'],
 c13:['단정한 태도 · 자리 정리 · 에너지 절약 · 약속 시간 엄수 · 학용품 관리 · 교복 착용 바름','몸에 밴 예의 · 기본이 탄탄함']
};
function defaultCats(){
  const cs = baseCats();
  cs.forEach(c => { const x = EXTRA[c.id]; if(!x) return;
    [...parse(x[0], 'b'), ...parse(x[1] || '', 'g')].forEach(it => { if(!c.items.some(i => i.t === it.t)) c.items.push(it); }); });
  return cs;
}
function baseCats(){ return [
mk('c1','학습태도',
 '성실함 · 꾸준함 · 끈기 · 자기주도적 · 호기심 · 집중력 · 꼼꼼함 · 예습복습 습관 · 수업 참여도 높음 · 질문을 즐김 · 필기 정리 우수 · 과제 성실 수행 · 학습 계획 실천 · 배움에 대한 열의 · 오답 분석 · 학습 몰입 · 포기하지 않음',
 '자기 기준이 높음 · 자신과의 약속 · 허투루 하지 않음 · 대충이 없음 · 뒷심 · 뚝심'),
mk('c2','사고력·학업역량',
 '이해력 · 분석력 · 논리적 사고 · 비판적 사고 · 문제해결력 · 응용력 · 추론 능력 · 통찰력 · 판단력 · 핵심 파악 · 정보 정리 능력 · 독해력 · 사고의 유연성 · 다각적 접근',
 '자기만의 관점 · 남다른 시선 · 질문의 수준이 높음 · 본질을 짚음 · 한 걸음 더 들어감 · 되묻는 힘 · 생각의 근육 · 사색적 · 철학적 질문 · 통념에 의문을 가짐 · 통합적으로 바라봄'),
mk('c3','인성·품성',
 '정직함 · 책임감 · 배려심 · 겸손함 · 예의 바름 · 긍정적 · 솔선수범 · 온화함 · 마음이 따뜻함 · 인내심 · 공정함 · 신뢰감 · 사려 깊음 · 감사할 줄 앎 · 이타적 · 존중하는 태도 · 밝은 성격 · 순수함 · 반듯함',
 '겸허함 · 낮은 자세 · 베풂 · 맑은 마음 · 진정성 · 허세가 없음 · 꾸밈없음 · 한결같음 · 진심'),

/* ---------- 상태 ---------- */
const KEY = 'haengteuk-keywords-v1';
let S = load() || {students: [], cats: defaultCats(), nextId: 1, curId: null};
const DEFAULT_PROMPT = `아래 키워드를 바탕으로 중학교 생활기록부 '행동특성 및 종합의견'을 작성해 주세요.
- 교사가 관찰한 시점의 서술형(~함, ~임)으로 쓰고 500자 안팎으로 작성
- 키워드를 그대로 나열하지 말고 자연스러운 문장으로 풀어 쓰기
- 학생 이름, 기관명, 사교육, 부정적이거나 단정적인 표현은 쓰지 않기
- 키워드에 없는 구체적인 사실이나 수상 실적, 활동 내용은 지어내지 않기`;
const getPrompt = () => (S.prompt && S.prompt.trim()) ? S.prompt : DEFAULT_PROMPT;
const buildPrompt = s => getPrompt().trim() + '\n\n키워드: ' + resultLine(s);
const UI = {filter: 'all', tab: 'c1', q: '', onlyTodo: false, editKw: false, editRoster: false};
function load(){
  try{ const v = JSON.parse(localStorage.getItem(KEY)); if(v && Array.isArray(v.students) && Array.isArray(v.cats)) return v; }catch(e){}
  return null;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600); }
const cur = () => S.students.find(s => s.id === S.curId) || null;

function usage(){
  const m = new Map();
  S.students.forEach(s => s.kw.forEach(k => m.set(k, (m.get(k) || 0) + 1)));
  return m;
}
function resultLine(s){
  const parts = s.kw.slice();
  const memo = (s.memo || '').trim();
  if(memo) parts.push(memo);
  return parts.join(', ');
}

/* 키워드가 어느 카테고리에서 선택됐는지 (선택 당시 카테고리를 기억, 없으면 목록에서 찾음) */
function catLabel(s, text){
  const id = s.src && s.src[text];
  if(id === '_free') return '직접 입력';
  const byId = id && S.cats.find(c => c.id === id);
  if(byId) return byId.name;
  const found = S.cats.find(c => c.items.some(i => i.t === text));
  return found ? found.name : '직접 입력';
}
function groupByCat(s){
  const order = S.cats.map(c => c.name).concat('직접 입력');
  const m = new Map();
  s.kw.forEach(k => { const n = catLabel(s, k); if(!m.has(n)) m.set(n, []); m.get(n).push(k); });
  return [...m.entries()].sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0])).map(([name, items]) => ({name, items}));
}
const catSummary = s => groupByCat(s).map(g => `[${g.name}] ${g.items.join(', ')}`).join(' / ');

/* ---------- 렌더: 명렬표 ---------- */
function renderStudents(){
  const ul = $('#slist');
  $('#btnEditRoster').classList.toggle('on', UI.editRoster);
  $('#btnEditRoster').textContent = UI.editRoster ? '완료' : '수정';
  $('#addRow').style.display = UI.editRoster ? 'flex' : 'none';
  const done = S.students.filter(s => s.kw.length).length;
  $('#prog').textContent = S.students.length ? `${done} / ${S.students.length}명 완료` : '';
  if(!S.students.length){
    ul.innerHTML = '<li class="empty">학생이 없습니다.<br>위의 <b>붙여넣기</b>로 명렬표를 넣어 주세요.</li>';
    return;
  }
  const list = S.students.filter(s => !UI.onlyTodo || !s.kw.length || s.id === S.curId);
  ul.innerHTML = list.map(s => UI.editRoster
    ? `<li class="srow" data-id="${s.id}"><input class="n" value="${esc(s.num)}" data-f="num" aria-label="번호"><input class="m" value="${esc(s.name)}" data-f="name" aria-label="이름"><button class="btn sm danger" data-del="${s.id}" title="삭제">✕</button></li>`
    : `<li class="srow ${s.id === S.curId ? 'cur' : ''}" data-id="${s.id}"><span class="no">${esc(s.num)}</span><span class="nm">${esc(s.name)}</span><span class="bd ${s.kw.length ? 'has' : ''}">${s.kw.length}</span></li>`
  ).join('') || '<li class="empty">모두 완료했어요 🎉</li>';

/* ---------- 렌더: 키워드 ---------- */
function renderTabs(){
  const s = cur();
  const sel = new Set(s ? s.kw : []);
  const tabs = [{id: 'all', name: '전체', n: s ? s.kw.length : 0}].concat(S.cats.map(c => ({id: c.id, name: c.name, n: c.items.filter(i => sel.has(i.t)).length})));
  $('#tabs').innerHTML = tabs.map(t => `<button class="tab ${UI.tab === t.id ? 'on' : ''}" data-tab="${t.id}">${esc(t.name)}${t.n ? `<i>${t.n}</i>` : ''}</button>`).join('');
}
function renderSecs(){
  const s = cur();
  const sel = new Set(s ? s.kw : []);
  const use = usage();
  const q = UI.q.trim();
  const multi = UI.tab === 'all' || !!q;
  const cats = multi ? S.cats : S.cats.filter(c => c.id === UI.tab);
  let html = '';
  cats.forEach(c => {
    const items = c.items.map((it, i) => ({it, i})).filter(({it}) => (UI.filter === 'all' || it.k === UI.filter) && (!q || it.t.includes(q)));
    if(!items.length && !UI.editKw) return;
    const chips = items.map(({it, i}) => {
      const on = sel.has(it.t);
      const n = (use.get(it.t) || 0) - (on ? 1 : 0);
      return `<button class="chip ${it.k} ${on ? 'on' : ''}" data-c="${c.id}" data-i="${i}">${esc(it.t)}${n > 0 ? `<sup>${n}</sup>` : ''}${UI.editKw ? '<span class="x" data-delkw="1">✕</span>' : ''}</button>`;
    }).join('');
    html += `<section class="sec"><h3>${esc(c.name)}<small>${c.items.length}개</small><span class="sp"></span>${UI.editKw ? `<button class="btn sm" data-renamecat="${c.id}">이름 변경</button><button class="btn sm danger" data-delcat="${c.id}">분류 삭제</button>` : ''}</h3><div class="chips">${chips}</div>${UI.editKw ? `<form class="addkw" data-addto="${c.id}"><input placeholder="키워드 추가 (쉼표로 여러 개)"><button class="btn sm">추가</button></form>` : ''}</section>`;
  });
  if(UI.editKw) html += `<form class="addkw wide" id="addCat" style="margin-top:4px"><input placeholder="새 분류 이름"><button class="btn sm">분류 추가</button></form>`;
  if(!html) html = '<div class="empty">조건에 맞는 키워드가 없습니다.</div>';
  $('#secs').innerHTML = html;
  $('#secs').className = multi ? 'grid' : '';
  renderNav(multi);
  $('#btnEditKw').classList.toggle('on', UI.editKw);
  $('#btnEditKw').textContent = UI.editKw ? '편집 끝내기' : '키워드 편집';
}

function renderNav(multi){
  const nav = $('#catNav'), n = S.cats.length, i = S.cats.findIndex(c => c.id === UI.tab);
  if(multi || i < 0 || n < 2){ nav.innerHTML = ''; return; }
  const prev = S.cats[(i - 1 + n) % n], next = S.cats[(i + 1) % n];
  nav.innerHTML = `<button class="btn" data-nav="-1">← ${esc(prev.name)}</button><span class="sp"></span><span class="cnt">${i + 1} / ${n} (← → 키로도 이동)</span><span class="sp"></span><button class="btn" data-nav="1">${esc(next.name)} →</button>`;
}
function navCat(d){
  const n = S.cats.length, i = S.cats.findIndex(c => c.id === UI.tab);
  if(i < 0 || n < 2) return;
  UI.tab = S.cats[(i + d + n) % n].id;
  renderTabs(); renderSecs(); $('#mid').scrollTop = 0;
}

/* ---------- 동작 ---------- */
function selectStudent(id){ S.curId = id; save(); renderAll(); }
function toggleKw(text, catId){
  const s = cur(); if(!s){ toast('먼저 왼쪽에서 학생을 선택하세요'); return; }
  const i = s.kw.indexOf(text);
  if(!s.src) s.src = {};
  if(i >= 0){ s.kw.splice(i, 1); delete s.src[text]; } else { s.kw.push(text); if(catId) s.src[text] = catId; }
  save(); renderStudents(); renderTabs(); renderSecs(); renderRight();
}
function copyText(text, msg){
  const done = () => toast(msg || '복사했습니다');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('복사에 실패했습니다'); } t.remove();
}
function nextNum(){ const nums = S.students.map(s => parseInt(s.num, 10)).filter(n => !isNaN(n)); return String((nums.length ? Math.max(...nums) : 0) + 1); }
function newStudent(num, name, old){ return {id: S.nextId++, num: String(num), name, kw: old ? old.kw : [], memo: old ? old.memo : ''}; }

  $('#dlgPaste').showModal();
};
$('#pasteCancel').onclick = () => $('#dlgPaste').close();
$('#pasteOk').onclick = () => {
  const lines = $('#paste').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const pool = S.students.slice();
  const rows = lines.map((l, i) => {
    const m = l.match(/^(\d+)[\s.,)\t]+(.+)$/);
    return m ? {num: m[1], name: m[2].trim()} : {num: String(i + 1), name: l};
  });
  const next = rows.map(r => {
    const k = pool.findIndex(p => p.name === r.name);
    const old = k >= 0 ? pool.splice(k, 1)[0] : null;
    if(old){ old.num = r.num; return old; }
    return newStudent(r.num, r.name);
  });
  const lost = pool.filter(p => p.kw.length || (p.memo || '').trim());
  if(lost.length && !confirm(`목록에서 빠지는 학생 중 ${lost.length}명은 선택한 키워드가 있습니다. 삭제하고 적용할까요?`)) return;
  S.students = next;
  if(!S.students.some(s => s.id === S.curId)) S.curId = S.students[0] ? S.students[0].id : null;
  save(); renderAll(); $('#dlgPaste').close(); toast(`${S.students.length}명으로 적용했습니다`);
};

  const blob = new Blob([text], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* 시작 */
if(S.dv !== 2){ /* 기본 키워드 목록 갱신: 직접 추가한 키워드와 새로 만든 분류는 유지 */
  const old = S.cats, fresh = defaultCats();
  fresh.forEach(c => { const o = old.find(x => x.id === c.id); if(o) o.items.filter(i => i.k === 'm').forEach(i => { if(!c.items.some(x => x.t === i.t)) c.items.push(i); }); });
  old.filter(c => /^u/.test(c.id)).forEach(c => fresh.push(c));
  S.cats = fresh; S.dv = 2; save();
}
if(!S.cats.some(c => c.id === UI.tab)) UI.tab = S.cats[0] ? S.cats[0].id : 'all';
if(!S.curId && S.students[0]) S.curId = S.students[0].id;
renderAll();
if(!S.students.length) setTimeout(() => $('#btnPaste').click(), 200);
</script>
